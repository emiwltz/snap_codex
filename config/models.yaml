collection:
  # The active POC design is defined in config/protocol.yaml.
  # These values are kept as collection defaults and documentation.
  temperatures: [0.0, 0.5, 1.0]
  runs: 10
  min_delay_seconds: 1.0
  max_tokens: 2048
  api_endpoint: "https://openrouter.ai/api/v1/chat/completions"
  top_p: 1.0

models:
  - id: "claude-sonnet-4-5"
    label: "Claude Sonnet 4.5"
    openrouter_model_id: "anthropic/claude-sonnet-4.5"
    provider: "Anthropic"
    thinking_mode: "enabled_by_default"
    active: true
  - id: "gpt-5-2"
    label: "GPT 5.2"
    openrouter_model_id: "openai/gpt-5.2"
    provider: "OpenAI"
    thinking_mode: "enabled_by_default"
    disabled_request_parameters: ["temperature", "top_p"]
    active: true
  - id: "gemini-3-pro"
    label: "Gemini 3.1 Pro Preview"
    openrouter_model_id: "google/gemini-3.1-pro-preview"
    provider: "Google"
    thinking_mode: "not_available"
    active: true
  - id: "qwen3-max"
    label: "Qwen3 Max"
    openrouter_model_id: "qwen/qwen3-max"
    provider: "Alibaba"
    thinking_mode: "not_available"
    active: true
  - id: "mistral-large-3"
    label: "Mistral Large 3"
    openrouter_model_id: "mistralai/mistral-large-2512"
    provider: "Mistral"
    thinking_mode: "disabled"
    active: true
  - id: "grok-4-1-thinking"
    label: "Grok 4.1 Thinking"
    openrouter_model_id: "x-ai/grok-4.1-fast"
    provider: "xAI"
    thinking_mode: "enabled_by_default"
    active: true

judges:
  haiku:
    label: "Claude Haiku 4.5"
    openrouter_model_id: "anthropic/claude-haiku-4.5"
  kimi:
    label: "Kimi K2.5"
    openrouter_model_id: "moonshotai/kimi-k2.5"

# Run `python -m src.runner preflight` just before collection to refresh model
# availability, parameter support, and pricing from the OpenRouter catalog.
# `thinking_mode` is logged per row as a configured provider/default trace; v3.1
# does not manipulate reasoning as an experimental factor.
